version: '3'
services:
  db:
    image: 'postgres:12'
    environment:
      - POSTGRES_PASSWORD=tabbycat
      - POSTGRES_USER=tabbycat
      - POSTGRES_DB=tabbycat
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
  redis:
    image: 'redis:6'
    volumes:
      - 'redis_data:/data'
  web:
    build: .
    command:
      - ./bin/docker-wait.sh
      - '--timeout=0'
      - 'db:5432'
      - '--'
      - ./bin/docker-run-honcho.sh
    depends_on:
      - db
      - redis
    expose:
      - '8000'
    environment:
      - DEBUG=1
      - IN_DOCKER=1
      - DISABLE_SENTRY=1
      - DOCKER_REDIS=1
      - USING_NGINX=1
    ports:
      - '8000:8000'
    working_dir: /tcd
  worker:
    build: .
    command:
      - ./bin/docker-wait.sh
      - '--timeout=0'
      - 'web:8000'
      - '--'
      - ./bin/docker-run-worker.sh
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=1
      - IN_DOCKER=1
      - DISABLE_SENTRY=1
      - DOCKER_REDIS=1
      - USING_NGINX=1
    working_dir: /tcd
volumes:
  pgdata: null
  node_modules: null
  redis_data: null
